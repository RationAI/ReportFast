# The smallest manifest that is a report: a folder of slides, one mask folder.
#
#     reportfast plan  manifests/example.yaml
#     reportfast build manifests/example.yaml
#
# Copy this one and change four things -- title, the background path, the mask
# path, the color -- and you have a report. `dysplasia.yaml` beside it is the same
# vocabulary pushed to its limits: MLflow run sources, class maps, `only:`,
# `min_layers:`, prose blocks.
#
# Every key here is checked strictly: a key the library does not know is an error
# with the nearest candidate named, not a silently ignored line. That is why this
# file lists so few -- the ones you actually need on day one.

title: Slide QC
subtitle: Every slide in the folder, with its tissue mask

# Where the HTML goes, relative to this file. A manifest in `manifests/` with no
# `out:` lands in `../reports/` on its own; `out:` says it explicitly so the plan
# and the reader agree without opening the tool's docs.
out: ../reports/example.html

# The slides. Anything the image server reads: .svs, .tiff, .ndpi, .czi (the last
# needs a `slide_protocols` entry registered in the deployment's env.json -- say
# so with endpoint.image_protocol below).
background:
  drive: /mnt/data/example/slides

# Overlays. One row per layer the reader can switch on.
#
#   color    the heatmap tint
#   opacity  0..1
#   visible  starts switched on -- leave false unless the layer should be bare
#   classes  turn a label image into a class map: N distinct values
#   palette  one color per class
#
# Masks come from a folder (drive:) or from an MLflow run (run: + path:). A run's
# files are listed, never downloaded: each becomes the DataID the tile server
# addresses it by, mflow/<experiment>/<run>/artifacts/<path>. Check what is under
# a run before naming it: `reportfast find <run-id> --path <dir>`.
#
# The run row is commented out because this file's job is to plan on the first
# try, and it cannot do that with a run in it: an MLflow run holds *its* cases, so
# unless your slides happen to be the ones that analysis ran on, the run's stems
# match none of them and the gate stops the build -- correctly, but on someone's
# tutorial. Uncomment it when your backgrounds and your masks come from the same
# job, which is the normal case for a real report and the reason the row is here.
masks:
  - name: Tissue
    drive: /mnt/data/example/tissue_masks
    color: "#ffff00"
    opacity: 0.5

  # - name: Annotations
  #   run: 41d5e1d7d43641ea8f645f9b7945e9f7
  #   path: annot_masks
  #   classes: 3
  #   palette: ["#ffffff", "#ff0000", "#00ff00"]
  #   breaks: [0.25, 0.75]
  #   mask: [0, 1, 1]          # class 0 is the slide, not an annotation

# Optional. Without `only:`, every file in the background folder is a case --
# which for 378 slides is a report nobody scrolls through. Names are stems
# (no extension), and a stem no case answers to is an error, not a silent drop.
# only:
#   - 1094_18_HE_0
#   - 1095_18_HE_A

# Optional. Drop a case with fewer overlays than this: a slide that got two of
# eleven masks is a retrieval mistake, and showing it implies it was checked.
# Anything dropped is listed under `dropped by min_layers:` in the plan.
# min_layers: 3

# Optional, and the only block type worth having on day one. The rest --
# heading, bullets, links, metrics, chart, section -- are in
# skills/reportfast/manifest.example.yaml.
blocks:
  - prose: >-
      One paragraph of what this report is for. Write it: the cards show the
      images, and this is the only place the report can say what to look at.

# Optional. Where `--publish` would log the report. Setting this does NOT upload
# anything -- building never touches MLflow. And note there is no key that makes
# publishing automatic, on purpose: it is a flag a person types.
# publish: e313fc2a62d54057b41b46057577c75d

# Optional. Only the fields that differ from the deployment default -- the rest
# are inherited, so a report aimed at a second deployment is usually a flag on the
# command line rather than an edit to the manifest.
# endpoint:
#   base_url: https://viewer.example/v3/
#   wsi_base_url: https://tiles.example/wsi/v3/   # its own mount, not under base_url
#   image_protocol: wsi_service                   # for .czi backgrounds
#   mount_root: /mnt                              # "" to stop stripping a prefix

# Optional. The tracking server, for masks whose source is a run and for
# --publish. $MLFLOW_TRACKING_URI works too, and beats nothing but this key.
# flow:
#   tracking_uri: http://mlflow.example:5000/
