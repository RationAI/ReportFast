[project]
name = "report-fast"
version = "0.1.0"
description = "Static HTML reports for whole slide images, linking into the xOpat v3 viewer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-fasthtml>=0.5.0",
]

[project.scripts]
# `reportfast skill`. main() returns the exit code and the generated wrapper passes
# it to sys.exit, so the codes in report_fast/__main__.py are the ones CI sees.
reportfast = "report_fast.__main__:main"

[project.optional-dependencies]
# Only report_fast.mlflow talks to the tracking API; import it and the rest of
# the package keeps working without this. The deployment runs two tracking
# servers (2.16.2 and 3.16.0) and the 2.x client reads and writes both; a 3.x
# client reads both as well, and fails only when publishing to the OLD server
# (log_artifacts 404s on /mlflow/logged-models/search, measured 2026-09-23).
# The cap is a supported floor/ceiling, not a deployment lock: the floor is
# where list_artifacts pagination settled, the ceiling is where nothing has
# been measured. Measured matrix: skills/reportfast/references/mlflow.md.
mlflow = ["mlflow>=2.8,<4"]

[dependency-groups]
# The self-dependency pulls the mlflow extra so `uv sync --group dev` is enough to
# run every test, rather than every contributor rediscovering which --extra they
# were missing. matplotlib is gone with the chart component it was pulled for; an
# agent that wants a plot has no component for it, which is the ruling, not an
# omission.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "report-fast[mlflow]",
]

[tool.ruff]
# The rules this repo is held to, in the project rather than in a long command
# someone has to remember: pyflakes, syntax errors, and bugbear. Not the style
# families -- import ordering and naming are not what a report bug hides behind,
# and reformatting 30 files to satisfy a linter is not a reviewable change.
lint.select = ["F", "E9", "B"]
# No exclude list. The one entry here was `_legacy/`, the state/server/resolver layer
# DESIGN.md called "deleted in spirit, kept on disk"; the directory is gone now, and an
# exclusion naming something that does not exist is the kind of line a reader stops
# trusting. If dead code ever returns it gets deleted or fixed, not excluded.

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["report_fast"]

# The skill travels inside the wheel, as `report_fast/skill/`, so an installed
# library can print the procedure it ships (`reportfast skill show`). Printing is
# all it does: Claude Code takes a skill from a committed `skills/` directory or as
# a plugin, so there is nothing here for this package to install.
# force-include rather than a copy step: one source of truth on disk --
# skills/reportfast/ -- and the wheel is a projection of it, so the skill the
# agent reads and the skill the tests check cannot disagree. An editable install
# does not materialise force-include targets, which is why report_fast/skill.py
# also looks for the checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills/reportfast" = "report_fast/skill"
# The golden sessions the skill tells an agent to imitate. Bundled for the same
# reason, as its own directory rather than nested inside the skill: in a checkout
# examples/ is a sibling of skills/, and nesting it would make the two layouts
# answer different paths for the same thing.
"examples" = "report_fast/examples"
