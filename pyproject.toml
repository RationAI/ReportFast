[project]
name = "report-fast"
version = "0.1.0"
description = "Static HTML reports for whole slide images, linking into the xOpat v3 viewer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-fasthtml>=0.5.0",
]

[project.scripts]
# `reportfast plan|build|find`. main() returns the exit code and the generated
# wrapper passes it to sys.exit, so the codes in report_fast/__main__.py are the
# ones CI sees.
reportfast = "report_fast.__main__:main"

[project.optional-dependencies]
# Manifest mode -- YAML in, report out. Kept out of the base install for the
# same reason mlflow is: `import report_fast` and every Python entry point work
# without it, and manifest.py says which `uv sync` to run when it is asked for
# and absent.
manifest = ["pyyaml>=6"]
# Only report_fast.mlflow talks to the tracking API; import it and the rest of
# the package keeps working without this. Capped below 3 because the deployment
# runs a 2.x tracking server: a 3.x client calls endpoints it does not have
# (listing artifacts 404s on /mlflow/logged-models/search).
mlflow = ["mlflow>=2.8,<3"]
# The whole CLI. `uv sync --extra all` is what the skill's scripts assume.
all = ["report-fast[manifest,mlflow]"]

[dependency-groups]
# matplotlib backs the chart in scripts/test_report.py; the rest are dev-only tools.
# The self-dependency pulls both extras so `uv sync --group dev` is enough to run
# the manifest tests and the CLI, rather than every contributor rediscovering
# which --extra they were missing.
dev = [
    "matplotlib>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
    "report-fast[all]",
]

[tool.ruff]
# The rules this repo is held to, in the project rather than in a long command
# someone has to remember: pyflakes, syntax errors, and bugbear. Not the style
# families -- import ordering and naming are not what a report bug hides behind,
# and reformatting 30 files to satisfy a linter is not a reviewable change.
lint.select = ["F", "E9", "B"]
# No exclude list. The one entry here was `_legacy/`, the state/server/resolver layer
# DESIGN.md called "deleted in spirit, kept on disk"; the directory is gone now, and an
# exclusion naming something that does not exist is the kind of line a reader stops
# trusting. If dead code ever returns it gets deleted or fixed, not excluded.

[tool.pytest.ini_options]
# scripts/ holds runnable demos named test_*.py; collection would import them.
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["report_fast"]

# The skill travels inside the wheel, as `report_fast/skill/`, so an installed
# lib can print or install the procedure it ships (`reportfast skill show`).
# force-include rather than a copy step: one source of truth on disk --
# skills/reportfast/ -- and the wheel is a projection of it, so the skill the
# agent reads and the skill the tests check cannot disagree. An editable install
# does not materialise force-include targets, which is why report_fast/skill.py
# also looks for the checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills/reportfast" = "report_fast/skill"
# The golden sessions the skill tells an agent to imitate. Bundled for the same
# reason, as its own directory rather than nested inside the skill: in a checkout
# examples/ is a sibling of skills/, and nesting it would make the two layouts
# answer different paths for the same thing.
"examples" = "report_fast/examples"
